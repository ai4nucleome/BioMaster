# Canonical BioSkills access policy.
#
# Both the Python SQLite control plane and the TypeScript file-backed tool read
# this file. Unknown roles/layers and empty agent lists are denied by default.
#
# ── Why an interface? ────────────────────────────────────────────────────
# The BioMaster worker set is intentionally narrow: plan / execute / debug /
# check. To connect a role to the BioSkills library, edit THIS file rather than
# changing agent prompts.
#
# ── Layer values ─────────────────────────────────────────────────────────
#   macro - description / overview layer (macro.md + macro_tags)      -> planning
#   micro - execution layer (micro.md + micro_tags: cmds/params/etc.) -> coding
#   none  - metadata only; no skill body is exposed
#
# ── Capability guidance (how to classify a NEW agent) ────────────────────
#   planning-type      (turns intent into a plan)      -> macro
#   coding-type        (writes/fixes commands)         -> micro
#   verification-type  (checks execute evidence)       -> micro
#   management tooling (catalogues skills)              -> none (metadata only)

default:
  layer: none

roles:
  biomaster-plan:
    layer: macro
  biomaster-execute:
    layer: micro
  biomaster-debug:
    layer: micro
  biomaster-check:
    layer: micro
  biomaster-skiller:
    layer: none
  biomaster-skill-author:
    layer: none
  biomaster-skill-creator:
    layer: none

# Canonical SQLite layer -> agents allowed to receive the skill body.
layer_agents:
  registry: [biomaster-plan]
  domain-guide: [biomaster-plan]
  discipline: [biomaster-plan]
  pipeline: [biomaster-plan]
  plan: [biomaster-plan]
  exec: [biomaster-execute, biomaster-debug, biomaster-check]
  execute: [biomaster-execute, biomaster-debug, biomaster-check]
  verify: [biomaster-check, biomaster-execute, biomaster-debug]
  debug: [biomaster-debug]
  env: [biomaster-execute, biomaster-debug]
  report: [biomaster-plan]
  bioskill: [biomaster-plan, biomaster-execute, biomaster-debug, biomaster-check]

record_agents:
  workflow: [biomaster-plan]
  task: [biomaster-execute, biomaster-debug, biomaster-check]

# aliases: map future / renamed / merged agent names onto an existing role so
# they inherit that role's policy without adding a new `roles:` entry.
# Edit these when the agent graph changes (merge/rename/add).
aliases:
  biomaster-intake: biomaster-plan
  biomaster-worker: biomaster-execute
  intake-agent: biomaster-plan
  plan-agent: biomaster-plan
  execute-agent: biomaster-execute
  task-agent: biomaster-execute
  check-agent: biomaster-check
  verify-agent: biomaster-check
  debug-agent: biomaster-debug
